<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="arenaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030612"/>
      <stop offset="100%" stop-color="#080e24"/>
    </linearGradient>

    <!-- Paths for Drone Motion -->
    <path id="dronePath1" d="M 320,240 Q 450,80 580,210 Q 720,280 850,110 T 400,100 Z" fill="none"/>
    <path id="dronePath2" d="M 850,110 Q 700,280 550,120 Q 400,70 320,240 Z" fill="none"/>
  </defs>

  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Orbitron:wght@700;900&family=Fira+Code:wght@400;600&display=swap');
    
    .bg { fill: url(#arenaBg); rx: 8px; stroke: #1e293b; stroke-width: 1.5; }
    .grid { fill: none; stroke: #1e293b; stroke-width: 0.5; opacity: 0.2; }
    
    .font-hud { font-family: 'Space Grotesk', sans-serif; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-code { font-family: 'Fira Code', monospace; }
    
    .title { font-size: 13px; font-weight: 900; fill: #00F5D4; letter-spacing: 2px; }
    .subtitle { font-size: 10px; fill: #64748b; letter-spacing: 1px; }
    
    @keyframes pulse-zone {
      0%, 100% { fill-opacity: 0.1; stroke-opacity: 0.4; }
      50% { fill-opacity: 0.3; stroke-opacity: 0.9; filter: url(#glow-pink); }
    }
    .hazard-zone { animation: pulse-zone 4s infinite; fill: #ef4444; stroke: #f43f5e; stroke-width: 1.5; }
    
    @keyframes rotate-prop {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .propeller { animation: rotate-prop 0.2s linear infinite; transform-origin: center; }
    
    @keyframes target-pulse {
      0%, 100% { transform: scale(1); filter: url(#glow-green); }
      50% { transform: scale(1.2); filter: url(#glow-green); }
    }
    .target-node { animation: target-pulse 3s infinite; transform-origin: 850px 110px; }
    ]]>
  </style>

  <!-- Base Card -->
  <rect width="1000" height="320" class="bg"/>

  <!-- Tactical Perspective Grid -->
  <path class="grid" d="M 0,40 L 1000,40 M 0,80 L 1000,80 M 0,120 L 1000,120 M 0,160 L 1000,160 M 0,200 L 1000,200 M 0,240 L 1000,240 M 0,280 L 1000,280
                     M 50,0 L 50,320 M 100,0 L 100,320 M 150,0 L 150,320 M 200,0 L 200,320 M 250,0 L 250,320 M 300,0 L 300,320 M 350,0 L 350,320 M 400,0 L 400,320 M 450,0 L 450,320 M 500,0 L 500,320 M 550,0 L 550,320 M 600,0 L 600,320 M 650,0 L 650,320 M 700,0 L 700,320 M 750,0 L 750,320 M 800,0 L 800,320 M 850,0 L 850,320 M 900,0 L 900,320 M 950,0 L 950,320"/>

  <!-- ==================== LEFT CONTROL PANEL ==================== -->
  <g transform="translate(30, 30)">
    <text class="font-orbitron title" x="0" y="15">🎯 AUTONOMOUS_SWARM_ARENA</text>
    <text class="font-hud subtitle" x="0" y="32">REAL-TIME MULTI-AGENT RL &amp; PATHFINDING SIMULATION</text>
    
    <line x1="0" y1="45" x2="240" y2="45" stroke="#1e293b" stroke-width="1"/>

    <!-- Telemetry readout card -->
    <rect x="0" y="58" width="240" height="195" fill="#02040b" stroke="#1e293b" stroke-width="1" rx="4"/>

    <g transform="translate(15, 75)">
      <text class="font-code" font-size="10" fill="#64748b" y="10">ENVIRONMENT: <tspan fill="#e2e8f0">Dynamic Vector Field</tspan></text>
      <text class="font-code" font-size="10" fill="#64748b" y="30">ALGORITHM: <tspan fill="#00F5D4">PPO + LangGraph</tspan></text>
      <text class="font-code" font-size="10" fill="#64748b" y="50">ACTIVE DRONES: <tspan fill="#00F2FE">3 Interceptors</tspan></text>
      <text class="font-code" font-size="10" fill="#64748b" y="70">KAFKA STREAM: <tspan fill="#9D4EDD">10.4k msgs/sec</tspan></text>
      <text class="font-code" font-size="10" fill="#64748b" y="90">HAZARD AVOIDANCE: <tspan fill="#10b981">OPTIMAL (0 Collisions)</tspan></text>
      <text class="font-code" font-size="10" fill="#64748b" y="110">EPISODE COUNTER: <tspan fill="#ffd700">0492 / 1000</tspan></text>
      <text class="font-code" font-size="10" fill="#64748b" y="130">SWARM SYNC RATE: <tspan fill="#00F5D4">99.9%</tspan></text>
      <text class="font-code" font-size="10" fill="#64748b" y="150">STATUS: <tspan fill="#00F2FE">AUTONOMOUS NAVIGATION</tspan></text>
    </g>
  </g>

  <!-- ==================== ARENA CANVAS (Right Space) ==================== -->
  <g transform="translate(300, 30)">
    <!-- Arena Border Canvas -->
    <rect width="670" height="260" fill="#02050e" stroke="#1e293b" stroke-width="1.2" rx="6"/>

    <!-- Planned Spline Trajectory Lines (Dotted Paths) -->
    <path d="M 20,210 Q 150,50 280,180 Q 420,250 550,80 T 100,70 Z" fill="none" stroke="#00F2FE" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.4"/>
    <path d="M 550,80 Q 400,250 250,90 Q 100,40 20,210 Z" fill="none" stroke="#9D4EDD" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.4"/>

    <!-- Obstacle Hazard Zones (Red Pulsing Circles) -->
    <g transform="translate(180, 130)">
      <circle r="25" class="hazard-zone"/>
      <text font-family="monospace" font-size="9" font-weight="bold" fill="#f43f5e" x="-14" y="3">HAZARD</text>
    </g>

    <g transform="translate(380, 180)">
      <circle r="30" class="hazard-zone" style="animation-delay: 1.5s;"/>
      <text font-family="monospace" font-size="9" font-weight="bold" fill="#f43f5e" x="-14" y="3">HAZARD</text>
    </g>

    <!-- Goal Target (Green Star Reticle at 550, 80) -->
    <g class="target-node" transform="translate(550, 80)">
      <circle r="18" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
      <circle r="8" fill="none" stroke="#10b981" stroke-width="2"/>
      <polygon points="0,-7 2,-2 7,-1 3,2 4,7 0,4 -4,7 -3,2 -7,-1 -2,-2" fill="#10b981"/>
      <text font-family="monospace" font-size="9" font-weight="bold" fill="#10b981" x="-15" y="-22">GOAL_NODE</text>
    </g>

    <!-- SMIL ANIMATED DRONES -->
    <!-- Drone Alpha (Cyan Interceptor) -->
    <g>
      <path d="M 20,210 Q 150,50 280,180 Q 420,250 550,80 T 100,70 Z" id="canvasPath1" fill="none"/>
      <g filter="url(#glow-cyan)">
        <!-- Drone Body -->
        <circle r="8" fill="#00F2FE"/>
        <circle r="3" fill="#ffffff"/>
        <!-- Propeller cross -->
        <line x1="-12" y1="0" x2="12" y2="0" stroke="#00F2FE" stroke-width="1.5" class="propeller"/>
        <line x1="0" y1="-12" x2="0" y2="12" stroke="#00F2FE" stroke-width="1.5" class="propeller"/>
      </g>
      <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
        <mpath href="#canvasPath1"/>
      </animateMotion>
    </g>

    <!-- Drone Beta (Violet Interceptor) -->
    <g>
      <path d="M 550,80 Q 400,250 250,90 Q 100,40 20,210 Z" id="canvasPath2" fill="none"/>
      <g filter="url(#glow-pink)">
        <circle r="8" fill="#9D4EDD"/>
        <circle r="3" fill="#ffffff"/>
        <line x1="-12" y1="0" x2="12" y2="0" stroke="#9D4EDD" stroke-width="1.5" class="propeller"/>
        <line x1="0" y1="-12" x2="0" y2="12" stroke="#9D4EDD" stroke-width="1.5" class="propeller"/>
      </g>
      <animateMotion dur="10s" repeatCount="indefinite" rotate="auto">
        <mpath href="#canvasPath2"/>
      </animateMotion>
    </g>
  </g>
</svg>
