<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 210" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#06090E"/>
    </linearGradient>

    <!-- Subtle Ambient Glows -->
    <radialGradient id="cyanAura" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetAura" cx="20%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
    </radialGradient>

    <!-- Typographic Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');

    .title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 2px;
      fill: url(#textGrad);
    }

    .tagline {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      font-size: 13.5px;
      letter-spacing: 0.5px;
      fill: #94A3B8;
    }

    .sub-tags {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 1.5px;
      fill: #64748B;
    }

    .status-text {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: 9.5px;
      letter-spacing: 1.2px;
      fill: #34D399;
    }

    /* Subtle Elegant Wave Animations */
    @keyframes waveFloat1 {
      0%, 100% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(-7px) scaleY(1.06); }
    }

    @keyframes waveFloat2 {
      0%, 100% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(8px) scaleY(0.94); }
    }

    @keyframes waveFloat3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    @keyframes dashCycle {
      to { stroke-dashoffset: -120; }
    }

    .wave-1 {
      animation: waveFloat1 7s ease-in-out infinite;
      transform-origin: 750px 105px;
    }

    .wave-2 {
      animation: waveFloat2 9s ease-in-out infinite;
      transform-origin: 750px 105px;
    }

    .wave-3 {
      animation: waveFloat3 11s ease-in-out infinite;
      transform-origin: 750px 105px;
    }

    .live-dot {
      animation: pulseDot 2.5s ease-in-out infinite;
      transform-origin: center;
    }

    .pulse-flow {
      stroke-dasharray: 6 14;
      animation: dashCycle 8s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="950" height="210" rx="12" fill="url(#bgGrad)"/>
  <rect width="950" height="210" rx="12" fill="url(#cyanAura)"/>
  <rect width="950" height="210" rx="12" fill="url(#violetAura)"/>

  <!-- Minimal Border & Top Accent Line -->
  <rect x="0.75" y="0.75" width="948.5" height="208.5" rx="11.25" fill="none" stroke="#1E293B" stroke-width="1.2" opacity="0.7"/>
  <line x1="60" y1="1" x2="360" y2="1" stroke="url(#accentGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.75" filter="url(#softGlow)"/>

  <!-- Subtle Minimal Grid Pattern (Right Half) -->
  <g opacity="0.08" stroke="#94A3B8" stroke-width="0.5">
    <line x1="580" y1="0" x2="580" y2="210"/>
    <line x1="660" y1="0" x2="660" y2="210"/>
    <line x1="740" y1="0" x2="740" y2="210"/>
    <line x1="820" y1="0" x2="820" y2="210"/>
    <line x1="900" y1="0" x2="900" y2="210"/>
    <line x1="500" y1="42" x2="950" y2="42"/>
    <line x1="500" y1="84" x2="950" y2="84"/>
    <line x1="500" y1="126" x2="950" y2="126"/>
    <line x1="500" y1="168" x2="950" y2="168"/>
  </g>

  <!-- ================= LEFT: REFINED TYPOGRAPHY ================= -->
  <g transform="translate(48, 40)">
    <!-- Status Pill -->
    <g transform="translate(0, 0)">
      <rect width="186" height="24" rx="12" fill="#0B132B" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="14" cy="12" r="3.5" fill="#34D399" class="live-dot" filter="url(#softGlow)"/>
      <text x="26" y="15.5" class="status-text">AVAILABLE FOR RESEARCH</text>
    </g>

    <!-- Name -->
    <text x="0" y="58" class="title">NIKHIL CHAPKANADE</text>

    <!-- Headline Tagline -->
    <text x="0" y="85" class="tagline">Designing autonomous systems that perceive, reason, and act.</text>

    <!-- Domain Focus -->
    <g transform="translate(0, 116)">
      <text x="0" y="0" class="sub-tags">AGENTIC AI</text>
      <circle cx="78" cy="-3.5" r="1.5" fill="#475569"/>
      <text x="90" y="0" class="sub-tags">REINFORCEMENT LEARNING</text>
      <circle cx="260" cy="-3.5" r="1.5" fill="#475569"/>
      <text x="272" y="0" class="sub-tags">NEUROSCIENCE</text>
    </g>
  </g>

  <!-- ================= RIGHT: MINIMAL ORGANIC WAVE ART ================= -->
  <g transform="translate(40, 0)">
    <!-- Harmonic Wave 1 (Cyan) -->
    <g class="wave-1">
      <path d="M 520,105 C 570,55 630,155 690,105 C 750,55 810,155 870,105"
            fill="none" stroke="url(#waveGrad1)" stroke-width="2" filter="url(#softGlow)"/>
      <path d="M 520,105 C 570,55 630,155 690,105 C 750,55 810,155 870,105"
            fill="none" stroke="#38BDF8" stroke-width="1.2" class="pulse-flow" opacity="0.6"/>
    </g>

    <!-- Harmonic Wave 2 (Violet) -->
    <g class="wave-2">
      <path d="M 520,105 C 580,145 640,65 700,105 C 760,145 820,65 880,105"
            fill="none" stroke="url(#waveGrad2)" stroke-width="1.8" opacity="0.85"/>
      <path d="M 520,105 C 580,145 640,65 700,105 C 760,145 820,65 880,105"
            fill="none" stroke="#A855F7" stroke-width="1" class="pulse-flow" opacity="0.4" style="animation-direction: reverse;"/>
    </g>

    <!-- Harmonic Wave 3 (Emerald/Teal) -->
    <g class="wave-3">
      <path d="M 540,105 C 600,80 660,130 720,105 C 780,80 840,130 890,105"
            fill="none" stroke="url(#waveGrad3)" stroke-width="1.5" opacity="0.75"/>
    </g>

    <!-- Synapse Harmonic Nodes -->
    <g transform="translate(690, 105)">
      <circle r="7" fill="#38BDF8" fill-opacity="0.15"/>
      <circle r="3.5" fill="#38BDF8" filter="url(#softGlow)"/>
      <circle r="1" fill="#FFFFFF"/>
    </g>

    <g transform="translate(750, 72)">
      <circle r="5" fill="#818CF8" fill-opacity="0.15"/>
      <circle r="2.5" fill="#818CF8" filter="url(#softGlow)"/>
    </g>

    <g transform="translate(630, 138)">
      <circle r="5" fill="#34D399" fill-opacity="0.15"/>
      <circle r="2.5" fill="#34D399" filter="url(#softGlow)"/>
    </g>

    <g transform="translate(810, 138)">
      <circle r="6" fill="#A855F7" fill-opacity="0.15"/>
      <circle r="3" fill="#A855F7" filter="url(#softGlow)"/>
    </g>
  </g>
</svg>
