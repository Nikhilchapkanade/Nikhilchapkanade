<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="100%" stop-color="#091024"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Orbitron:wght@700;900&family=Fira+Code:wght@400;600&display=swap');

    .main-bg { fill: #02040a; }
    .panel { fill: url(#chipBg); stroke-width: 1.2; rx: 8px; }
    
    .font-hud { font-family: 'Space Grotesk', sans-serif; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-code { font-family: 'Fira Code', monospace; }

    .section-title { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    .tech-text { font-size: 12px; fill: #e2e8f0; font-weight: 500; }
    .tech-level { font-size: 9px; fill: #64748b; font-weight: bold; }

    .dot { r: 3px; }
    .dot-teal { fill: #00F5D4; filter: url(#glow-teal); }
    .dot-cyan { fill: #00F2FE; filter: url(#glow-cyan); }
    .dot-violet { fill: #9D4EDD; filter: url(#glow-violet); }
    .dot-pink { fill: #FF007F; filter: url(#glow-pink); }

    .panel-teal { stroke: #00F5D4; stroke-opacity: 0.3; }
    .panel-cyan { stroke: #00F2FE; stroke-opacity: 0.3; }
    .panel-violet { stroke: #9D4EDD; stroke-opacity: 0.3; }
    .panel-pink { stroke: #FF007F; stroke-opacity: 0.3; }

    @keyframes pulse-trace {
      0%, 100% { stroke-dashoffset: 40; opacity: 0.3; }
      50% { stroke-dashoffset: 0; opacity: 1; filter: url(#glow-cyan); }
    }
    .pcb-trace { fill: none; stroke: #00F2FE; stroke-width: 1.5; stroke-dasharray: 8 12; animation: pulse-trace 3s linear infinite; }
    ]]>
  </style>

  <!-- Background -->
  <rect width="1000" height="340" class="main-bg"/>

  <!-- PCB Circuit Trace Lines across background -->
  <path d="M 50,20 L 250,20 L 250,300 M 270,320 L 500,320 M 520,20 L 740,20 L 740,300 M 760,320 L 950,320" class="pcb-trace"/>

  <!-- GRID OF 4 CHIP PANELS (Width: 216, Spacing: 24, Margins: 24) -->

  <!-- PANEL 1: AI / REINFORCEMENT LEARNING -->
  <g transform="translate(24, 30)">
    <rect width="216" height="280" class="panel panel-teal"/>
    <rect width="216" height="3" fill="#00F5D4" rx="1.5"/>
    <text x="18" y="28" class="font-orbitron section-title" fill="#00F5D4">AI &amp; REINFORCEMENT LEARNING</text>
    <line x1="18" y1="38" x2="198" y2="38" stroke="#1e293b" stroke-width="0.8"/>

    <g transform="translate(18, 52)">
      <g transform="translate(0, 10)">
        <circle cx="4" cy="-4" class="dot dot-teal"/>
        <text x="16" y="0" class="font-hud tech-text">PyTorch</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">98%</text>
      </g>
      <g transform="translate(0, 32)">
        <circle cx="4" cy="-4" class="dot dot-teal"/>
        <text x="16" y="0" class="font-hud tech-text">Stable-Baselines3 (RL)</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">95%</text>
      </g>
      <g transform="translate(0, 54)">
        <circle cx="4" cy="-4" class="dot dot-teal"/>
        <text x="16" y="0" class="font-hud tech-text">LangGraph (Agents)</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">96%</text>
      </g>
      <g transform="translate(0, 76)">
        <circle cx="4" cy="-4" class="dot dot-teal"/>
        <text x="16" y="0" class="font-hud tech-text">OpenCV &amp; YOLO26</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">90%</text>
      </g>
      <g transform="translate(0, 98)">
        <circle cx="4" cy="-4" class="dot dot-teal"/>
        <text x="16" y="0" class="font-hud tech-text">HuggingFace Transformers</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">92%</text>
      </g>
      <g transform="translate(0, 120)">
        <circle cx="4" cy="-4" class="dot dot-teal"/>
        <text x="16" y="0" class="font-hud tech-text">Meta TRIBEv2 (Brain)</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">88%</text>
      </g>
      <g transform="translate(0, 142)">
        <circle cx="4" cy="-4" class="dot dot-teal"/>
        <text x="16" y="0" class="font-hud tech-text">Causal AI Models</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">85%</text>
      </g>
    </g>

    <!-- Bottom Chip Pins -->
    <rect x="20" y="250" width="176" height="12" rx="2" fill="#02040b" stroke="#1e293b" stroke-width="0.8"/>
    <rect x="22" y="252" width="140" height="8" rx="1" fill="#00F5D4" fill-opacity="0.8"/>
  </g>

  <!-- PANEL 2: BACKEND & SCALE -->
  <g transform="translate(264, 30)">
    <rect width="216" height="280" class="panel panel-cyan"/>
    <rect width="216" height="3" fill="#00F2FE" rx="1.5"/>
    <text x="18" y="28" class="font-orbitron section-title" fill="#00F2FE">BACKEND &amp; STREAMING</text>
    <line x1="18" y1="38" x2="198" y2="38" stroke="#1e293b" stroke-width="0.8"/>

    <g transform="translate(18, 52)">
      <g transform="translate(0, 10)">
        <circle cx="4" cy="-4" class="dot dot-cyan"/>
        <text x="16" y="0" class="font-hud tech-text">Python (FastAPI / Django)</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">98%</text>
      </g>
      <g transform="translate(0, 32)">
        <circle cx="4" cy="-4" class="dot dot-cyan"/>
        <text x="16" y="0" class="font-hud tech-text">Node.js (TypeScript)</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">94%</text>
      </g>
      <g transform="translate(0, 54)">
        <circle cx="4" cy="-4" class="dot dot-cyan"/>
        <text x="16" y="0" class="font-hud tech-text">Apache Kafka</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">90%</text>
      </g>
      <g transform="translate(0, 76)">
        <circle cx="4" cy="-4" class="dot dot-cyan"/>
        <text x="16" y="0" class="font-hud tech-text">MCP Protocol</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">97%</text>
      </g>
      <g transform="translate(0, 98)">
        <circle cx="4" cy="-4" class="dot dot-cyan"/>
        <text x="16" y="0" class="font-hud tech-text">PostgreSQL &amp; Vector DBs</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">92%</text>
      </g>
      <g transform="translate(0, 120)">
        <circle cx="4" cy="-4" class="dot dot-cyan"/>
        <text x="16" y="0" class="font-hud tech-text">MongoDB / Neo4j</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">88%</text>
      </g>
      <g transform="translate(0, 142)">
        <circle cx="4" cy="-4" class="dot dot-cyan"/>
        <text x="16" y="0" class="font-hud tech-text">AWS (Serverless / EC2)</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">90%</text>
      </g>
    </g>

    <rect x="20" y="250" width="176" height="12" rx="2" fill="#02040b" stroke="#1e293b" stroke-width="0.8"/>
    <rect x="22" y="252" width="155" height="8" rx="1" fill="#00F2FE" fill-opacity="0.8"/>
  </g>

  <!-- PANEL 3: FRONTEND & VISUALS -->
  <g transform="translate(504, 30)">
    <rect width="216" height="280" class="panel panel-violet"/>
    <rect width="216" height="3" fill="#9D4EDD" rx="1.5"/>
    <text x="18" y="28" class="font-orbitron section-title" fill="#9D4EDD">FRONTEND &amp; VISUALS</text>
    <line x1="18" y1="38" x2="198" y2="38" stroke="#1e293b" stroke-width="0.8"/>

    <g transform="translate(18, 52)">
      <g transform="translate(0, 10)">
        <circle cx="4" cy="-4" class="dot dot-violet"/>
        <text x="16" y="0" class="font-hud tech-text">React.js / Next.js</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">95%</text>
      </g>
      <g transform="translate(0, 32)">
        <circle cx="4" cy="-4" class="dot dot-violet"/>
        <text x="16" y="0" class="font-hud tech-text">Three.js &amp; WebGL</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">92%</text>
      </g>
      <g transform="translate(0, 54)">
        <circle cx="4" cy="-4" class="dot dot-violet"/>
        <text x="16" y="0" class="font-hud tech-text">TypeScript / JavaScript</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">96%</text>
      </g>
      <g transform="translate(0, 76)">
        <circle cx="4" cy="-4" class="dot dot-violet"/>
        <text x="16" y="0" class="font-hud tech-text">Flutter (Cross-Platform)</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">88%</text>
      </g>
      <g transform="translate(0, 98)">
        <circle cx="4" cy="-4" class="dot dot-violet"/>
        <text x="16" y="0" class="font-hud tech-text">Streamlit &amp; Dashboards</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">94%</text>
      </g>
      <g transform="translate(0, 120)">
        <circle cx="4" cy="-4" class="dot dot-violet"/>
        <text x="16" y="0" class="font-hud tech-text">TailwindCSS / HTML5</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">96%</text>
      </g>
      <g transform="translate(0, 142)">
        <circle cx="4" cy="-4" class="dot dot-violet"/>
        <text x="16" y="0" class="font-hud tech-text">SVG &amp; Canvas Shaders</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">90%</text>
      </g>
    </g>

    <rect x="20" y="250" width="176" height="12" rx="2" fill="#02040b" stroke="#1e293b" stroke-width="0.8"/>
    <rect x="22" y="252" width="145" height="8" rx="1" fill="#9D4EDD" fill-opacity="0.8"/>
  </g>

  <!-- PANEL 4: DEVOPS & MLOPS -->
  <g transform="translate(744, 30)">
    <rect width="216" height="280" class="panel panel-pink"/>
    <rect width="216" height="3" fill="#FF007F" rx="1.5"/>
    <text x="18" y="28" class="font-orbitron section-title" fill="#FF007F">TOOLS &amp; DEVOPS</text>
    <line x1="18" y1="38" x2="198" y2="38" stroke="#1e293b" stroke-width="0.8"/>

    <g transform="translate(18, 52)">
      <g transform="translate(0, 10)">
        <circle cx="4" cy="-4" class="dot dot-pink"/>
        <text x="16" y="0" class="font-hud tech-text">Docker &amp; Containers</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">95%</text>
      </g>
      <g transform="translate(0, 32)">
        <circle cx="4" cy="-4" class="dot dot-pink"/>
        <text x="16" y="0" class="font-hud tech-text">CUDA &amp; GPU Tuning</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">90%</text>
      </g>
      <g transform="translate(0, 54)">
        <circle cx="4" cy="-4" class="dot dot-pink"/>
        <text x="16" y="0" class="font-hud tech-text">MLflow / DVC Pipelines</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">92%</text>
      </g>
      <g transform="translate(0, 76)">
        <circle cx="4" cy="-4" class="dot dot-pink"/>
        <text x="16" y="0" class="font-hud tech-text">Airflow Orchestration</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">88%</text>
      </g>
      <g transform="translate(0, 98)">
        <circle cx="4" cy="-4" class="dot dot-pink"/>
        <text x="16" y="0" class="font-hud tech-text">Git &amp; GitHub Actions</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">98%</text>
      </g>
      <g transform="translate(0, 120)">
        <circle cx="4" cy="-4" class="dot dot-pink"/>
        <text x="16" y="0" class="font-hud tech-text">Linux (Ubuntu / Debian)</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">96%</text>
      </g>
      <g transform="translate(0, 142)">
        <circle cx="4" cy="-4" class="dot dot-pink"/>
        <text x="16" y="0" class="font-hud tech-text">CI / CD Production</text>
        <text x="180" y="0" class="font-code tech-level" text-anchor="end">94%</text>
      </g>
    </g>

    <rect x="20" y="250" width="176" height="12" rx="2" fill="#02040b" stroke="#1e293b" stroke-width="0.8"/>
    <rect x="22" y="252" width="160" height="8" rx="1" fill="#FF007F" fill-opacity="0.8"/>
  </g>
</svg>
