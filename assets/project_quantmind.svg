<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" width="100%" height="100%">
  <defs>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="100%" stop-color="#1f1804"/>
    </linearGradient>
  </defs>

  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Orbitron:wght@700&family=Fira+Code:wght@600&display=swap');

    .card-bg { fill: url(#cardBg); stroke: #FFD700; stroke-opacity: 0.3; stroke-width: 1.5; rx: 8px; }
    .card-glow { fill: none; stroke: #FFD700; stroke-opacity: 0.15; stroke-width: 1.5; rx: 8px; filter: url(#glow-gold); }

    .font-hud { font-family: 'Space Grotesk', sans-serif; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-code { font-family: 'Fira Code', monospace; }

    .title { font-size: 14px; font-weight: 700; fill: #FFD700; letter-spacing: 1px; }
    .desc { font-size: 10px; fill: #94a3b8; }
    .label { font-size: 9px; fill: #64748b; font-weight: bold; }
    .badge { font-size: 9px; fill: #fbbf24; font-weight: bold; }

    @keyframes chart-grow {
      0%, 100% { stroke-dashoffset: 100; }
      50% { stroke-dashoffset: 0; }
    }
    .chart-line { stroke: #FFD700; stroke-width: 2; stroke-dasharray: 100; animation: chart-grow 4s linear infinite; filter: url(#glow-gold); }
    ]]>
  </style>

  <rect width="320" height="170" class="card-bg"/>
  <rect width="320" height="170" class="card-glow"/>

  <g transform="translate(20, 24)">
    <rect width="75" height="16" rx="3" fill="#451a03" opacity="0.9"/>
    <text x="7" y="11" class="font-code" font-size="8" font-weight="bold" fill="#fbbf24">MCP_QUANT</text>

    <text x="0" y="34" class="font-orbitron title">QUANT-MIND</text>

    <text x="0" y="50" class="font-hud desc">Deep Learning Financial MCP Agent</text>
    <text x="0" y="63" class="font-hud desc">Live stock prediction inside Claude Desktop</text>

    <text x="0" y="90" class="font-hud label">TECH STACK:</text>
    <g transform="translate(0, 100)">
      <rect width="50" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">Python</text>

      <rect x="55" y="0" width="35" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">MCP</text>

      <rect x="95" y="0" width="65" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">PyTorch</text>
    </g>
  </g>

  <!-- Right Graphic: Financial Chart Curve -->
  <g transform="translate(210, 50)">
    <rect width="90" height="70" fill="#02040b" stroke="#1e293b" rx="4"/>
    <path d="M 10,55 L 30,40 L 45,50 L 65,20 L 80,30" fill="none" class="chart-line"/>
    <circle cx="65" cy="20" r="3" fill="#10b981"/>
  </g>
</svg>
