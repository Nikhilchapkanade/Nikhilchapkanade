<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" width="100%" height="100%">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="100%" stop-color="#041a24"/>
    </linearGradient>
  </defs>

  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Orbitron:wght@700&family=Fira+Code:wght@600&display=swap');

    .card-bg { fill: url(#cardBg); stroke: #00F2FE; stroke-opacity: 0.3; stroke-width: 1.5; rx: 8px; }
    .card-glow { fill: none; stroke: #00F2FE; stroke-opacity: 0.15; stroke-width: 1.5; rx: 8px; filter: url(#glow-cyan); }

    .font-hud { font-family: 'Space Grotesk', sans-serif; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-code { font-family: 'Fira Code', monospace; }

    .title { font-size: 14px; font-weight: 700; fill: #00F2FE; letter-spacing: 1px; }
    .desc { font-size: 10px; fill: #94a3b8; }
    .label { font-size: 9px; fill: #64748b; font-weight: bold; }
    .badge { font-size: 9px; fill: #2dd4bf; font-weight: bold; }

    @keyframes sweep-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .sweep-line { animation: sweep-spin 4s linear infinite; transform-origin: 250px 85px; }
    ]]>
  </style>

  <rect width="320" height="170" class="card-bg"/>
  <rect width="320" height="170" class="card-glow"/>

  <g transform="translate(20, 24)">
    <rect width="75" height="16" rx="3" fill="#042f2e" opacity="0.9"/>
    <text x="7" y="11" class="font-code" font-size="8" font-weight="bold" fill="#2dd4bf">RL_SWARM</text>

    <text x="0" y="34" class="font-orbitron title">INTERCEPTOR</text>

    <text x="0" y="50" class="font-hud desc">Autonomous Swarm Defense System</text>
    <text x="0" y="63" class="font-hud desc">RL control + Kafka streaming</text>

    <text x="0" y="90" class="font-hud label">TECH STACK:</text>
    <g transform="translate(0, 100)">
      <rect width="55" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">PyTorch</text>

      <rect x="60" y="0" width="48" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">Kafka</text>

      <rect x="113" y="0" width="45" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">Gym</text>

      <rect x="0" y="21" width="65" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">LangGraph</text>
    </g>
  </g>

  <!-- Right Graphic: Tactical Radar -->
  <g transform="translate(0, 0)">
    <circle cx="250" cy="85" r="40" fill="none" stroke="#1e293b" stroke-width="1"/>
    <circle cx="250" cy="85" r="25" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="2 2"/>
    <line x1="205" y1="85" x2="295" y2="85" stroke="#1e293b" stroke-width="0.5"/>
    <line x1="250" y1="40" x2="250" y2="130" stroke="#1e293b" stroke-width="0.5"/>

    <line x1="250" y1="85" x2="250" y2="45" stroke="#00F2FE" stroke-width="1.5" class="sweep-line"/>
    <circle cx="235" cy="65" r="3.5" fill="#ef4444" filter="url(#glow-cyan)"/>
    <circle cx="270" cy="75" r="3.5" fill="#ef4444" filter="url(#glow-cyan)"/>
  </g>
</svg>
