<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" width="100%" height="100%">
  <defs>
    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="100%" stop-color="#0b1024"/>
    </linearGradient>
  </defs>

  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Orbitron:wght@700&family=Fira+Code:wght@600&display=swap');
    
    .card-bg { fill: url(#cardBg); stroke: #9D4EDD; stroke-opacity: 0.3; stroke-width: 1.5; rx: 8px; }
    .card-glow { fill: none; stroke: #9D4EDD; stroke-opacity: 0.15; stroke-width: 1.5; rx: 8px; filter: url(#glow-violet); }
    
    .font-hud { font-family: 'Space Grotesk', sans-serif; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-code { font-family: 'Fira Code', monospace; }
    
    .title { font-size: 14px; font-weight: 700; fill: #9D4EDD; letter-spacing: 1px; }
    .desc { font-size: 10px; fill: #94a3b8; }
    .label { font-size: 9px; fill: #64748b; font-weight: bold; }
    .badge { font-size: 9px; fill: #c084fc; font-weight: bold; }
    
    @keyframes pulse-wave {
      0%, 100% { stroke-dashoffset: 0; }
      50% { stroke-dashoffset: -20; }
    }
    .brain-wave { stroke: #00F5D4; stroke-width: 1.5; stroke-dasharray: 4 4; animation: pulse-wave 2s linear infinite; }
    ]]>
  </style>

  <rect width="320" height="170" class="card-bg"/>
  <rect width="320" height="170" class="card-glow"/>

  <!-- Left Content -->
  <g transform="translate(20, 24)">
    <rect width="70" height="16" rx="3" fill="#1e1b4b" opacity="0.9"/>
    <text x="7" y="11" class="font-code" font-size="8" font-weight="bold" fill="#c084fc">3D_VISION</text>

    <text x="0" y="34" class="font-orbitron title">NEUROPRISM</text>

    <text x="0" y="50" class="font-hud desc">fMRI-grade 3D brain visualization</text>
    <text x="0" y="63" class="font-hud desc">synced with video &amp; Meta TRIBEv2</text>

    <text x="0" y="90" class="font-hud label">TECH STACK:</text>
    <g transform="translate(0, 100)">
      <rect width="68" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">TypeScript</text>

      <rect x="73" y="0" width="45" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">React</text>

      <rect x="0" y="21" width="55" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">Three.js</text>

      <rect x="60" y="21" width="55" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">Gemini</text>
    </g>
  </g>

  <!-- Right Graphic: Animated fMRI Brain Mesh -->
  <g transform="translate(245, 85)">
    <path d="M -30,-40 C -10,-55 20,-55 35,-35 C 50,-15 50,15 35,30 C 20,40 -10,35 -20,20 C -30,20 -40,10 -40,-10 C -40,-30 -45,-30 -30,-40 Z" fill="none" stroke="#1e293b" stroke-width="1.2"/>
    <path d="M -30,-40 C -10,-55 20,-55 35,-35" fill="none" class="brain-wave"/>
    <path d="M 35,30 C 20,40 -10,35 -20,20" fill="none" class="brain-wave" style="animation-delay: -1s; stroke: #9D4EDD;"/>
    <circle cx="-10" cy="-45" r="3.5" fill="#00F5D4" filter="url(#glow-violet)"/>
    <circle cx="25" cy="-25" r="3.5" fill="#9D4EDD" filter="url(#glow-violet)"/>
    <circle cx="35" cy="5" r="3.5" fill="#00F2FE" filter="url(#glow-violet)"/>
    <circle cx="5" cy="25" r="3.5" fill="#FF007F" filter="url(#glow-violet)"/>
  </g>
</svg>
