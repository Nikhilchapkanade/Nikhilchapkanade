<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" width="100%" height="100%">
  <defs>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="100%" stop-color="#1f0418"/>
    </linearGradient>
  </defs>

  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Orbitron:wght@700&family=Fira+Code:wght@600&display=swap');

    .card-bg { fill: url(#cardBg); stroke: #FF007F; stroke-opacity: 0.3; stroke-width: 1.5; rx: 8px; }
    .card-glow { fill: none; stroke: #FF007F; stroke-opacity: 0.15; stroke-width: 1.5; rx: 8px; filter: url(#glow-pink); }

    .font-hud { font-family: 'Space Grotesk', sans-serif; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-code { font-family: 'Fira Code', monospace; }

    .title { font-size: 14px; font-weight: 700; fill: #FF007F; letter-spacing: 1px; }
    .desc { font-size: 10px; fill: #94a3b8; }
    .label { font-size: 9px; fill: #64748b; font-weight: bold; }
    .badge { font-size: 9px; fill: #f472b6; font-weight: bold; }

    @keyframes cloud-pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); filter: url(#glow-pink); }
    }
    .cloud-icon { animation: cloud-pulse 3s infinite; transform-origin: 255px 85px; fill: #FF007F; }
    ]]>
  </style>

  <rect width="320" height="170" class="card-bg"/>
  <rect width="320" height="170" class="card-glow"/>

  <g transform="translate(20, 24)">
    <rect width="75" height="16" rx="3" fill="#831843" opacity="0.9"/>
    <text x="7" y="11" class="font-code" font-size="8" font-weight="bold" fill="#f472b6">CLOUD_GPU</text>

    <text x="0" y="34" class="font-orbitron title">CLAUDEVISION</text>

    <text x="0" y="50" class="font-hud desc">Claude Desktop to ComfyUI Bridge</text>
    <text x="0" y="63" class="font-hud desc">Zero-GPU Cloud Architecture Image Gen</text>

    <text x="0" y="90" class="font-hud label">TECH STACK:</text>
    <g transform="translate(0, 100)">
      <rect width="50" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">Python</text>

      <rect x="55" y="0" width="35" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">MCP</text>

      <rect x="95" y="0" width="60" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">ComfyUI</text>
    </g>
  </g>

  <!-- Right Graphic: Cloud Vision Node -->
  <g transform="translate(0, 0)">
    <path d="M 240,85 C 235,70 250,60 260,65 C 270,55 285,65 280,75 C 290,80 285,95 270,95 L 245,95 C 235,95 230,85 240,85 Z" fill="none" stroke="#FF007F" stroke-width="1.8" class="cloud-icon"/>
  </g>
</svg>
