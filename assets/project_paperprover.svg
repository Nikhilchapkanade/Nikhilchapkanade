<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" width="100%" height="100%">
  <defs>
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="100%" stop-color="#04201a"/>
    </linearGradient>
  </defs>

  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Orbitron:wght@700&family=Fira+Code:wght@600&display=swap');

    .card-bg { fill: url(#cardBg); stroke: #00F5D4; stroke-opacity: 0.3; stroke-width: 1.5; rx: 8px; }
    .card-glow { fill: none; stroke: #00F5D4; stroke-opacity: 0.15; stroke-width: 1.5; rx: 8px; filter: url(#glow-teal); }

    .font-hud { font-family: 'Space Grotesk', sans-serif; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-code { font-family: 'Fira Code', monospace; }

    .title { font-size: 14px; font-weight: 700; fill: #00F5D4; letter-spacing: 1px; }
    .desc { font-size: 10px; fill: #94a3b8; }
    .label { font-size: 9px; fill: #64748b; font-weight: bold; }
    .badge { font-size: 9px; fill: #34d399; font-weight: bold; }

    @keyframes debate-bounce {
      0% { cx: 225px; cy: 75px; }
      50% { cx: 275px; cy: 95px; }
      100% { cx: 225px; cy: 75px; }
    }
    .debate-packet { animation: debate-bounce 3s ease-in-out infinite; fill: #00F5D4; filter: url(#glow-teal); }
    ]]>
  </style>

  <rect width="320" height="170" class="card-bg"/>
  <rect width="320" height="170" class="card-glow"/>

  <g transform="translate(20, 24)">
    <rect width="80" height="16" rx="3" fill="#064e3b" opacity="0.9"/>
    <text x="7" y="11" class="font-code" font-size="8" font-weight="bold" fill="#34d399">AGENT_DEBATE</text>

    <text x="0" y="34" class="font-orbitron title">PAPER-PROVER</text>

    <text x="0" y="50" class="font-hud desc">Adversarial Research Claim Prover</text>
    <text x="0" y="63" class="font-hud desc">Catches inflated claims &amp; paper flaws</text>

    <text x="0" y="90" class="font-hud label">TECH STACK:</text>
    <g transform="translate(0, 100)">
      <rect width="60" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">JavaScript</text>

      <rect x="65" y="0" width="45" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">HTML5</text>

      <rect x="115" y="0" width="40" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">CSS3</text>

      <rect x="0" y="21" width="55" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">LLM API</text>
    </g>
  </g>

  <!-- Right Graphic: Debate Nodes -->
  <g transform="translate(0, 0)">
    <line x1="225" y1="75" x2="275" y2="95" stroke="#1e293b" stroke-width="2"/>
    <circle cx="225" cy="75" r="10" fill="#00F5D4" opacity="0.5"/>
    <circle cx="275" cy="95" r="10" fill="#9D4EDD" opacity="0.5"/>
    <circle r="4" class="debate-packet"/>
  </g>
</svg>
