<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" width="100%" height="100%">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="100%" stop-color="#041a24"/>
    </linearGradient>
  </defs>

  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Orbitron:wght@700&family=Fira+Code:wght@600&display=swap');

    .card-bg { fill: url(#cardBg); stroke: #00F2FE; stroke-opacity: 0.3; stroke-width: 1.5; rx: 8px; }
    .card-glow { fill: none; stroke: #00F2FE; stroke-opacity: 0.15; stroke-width: 1.5; rx: 8px; filter: url(#glow-cyan); }

    .font-hud { font-family: 'Space Grotesk', sans-serif; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-code { font-family: 'Fira Code', monospace; }

    .title { font-size: 14px; font-weight: 700; fill: #00F2FE; letter-spacing: 1px; }
    .desc { font-size: 10px; fill: #94a3b8; }
    .label { font-size: 9px; fill: #64748b; font-weight: bold; }
    .badge { font-size: 9px; fill: #38bdf8; font-weight: bold; }

    @keyframes lora-swap {
      0%, 100% { fill: #00F2FE; opacity: 0.5; }
      50% { fill: #9D4EDD; opacity: 1; filter: url(#glow-cyan); }
    }
    .lora-chip { animation: lora-swap 3s infinite; }
    ]]>
  </style>

  <rect width="320" height="170" class="card-bg"/>
  <rect width="320" height="170" class="card-glow"/>

  <g transform="translate(20, 24)">
    <rect width="85" height="16" rx="3" fill="#0369a1" opacity="0.9"/>
    <text x="7" y="11" class="font-code" font-size="8" font-weight="bold" fill="#38bdf8">LLM_ADAPTERS</text>

    <text x="0" y="34" class="font-orbitron title">SKILL-LLM</text>

    <text x="0" y="50" class="font-hud desc">Hot-swapping LoRA Adapters for LLMs</text>
    <text x="0" y="63" class="font-hud desc">Dynamic multi-task specialization without crashes</text>

    <text x="0" y="90" class="font-hud label">TECH STACK:</text>
    <g transform="translate(0, 100)">
      <rect width="50" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">Python</text>

      <rect x="55" y="0" width="40" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">LoRA</text>

      <rect x="100" y="0" width="60" height="16" rx="3" fill="#1e293b" opacity="0.6"/>
      <text x="6" y="11" class="font-code badge">PyTorch</text>
    </g>
  </g>

  <!-- Right Graphic: LoRA Chip Assembly -->
  <g transform="translate(225, 60)">
    <rect width="60" height="50" fill="#02040b" stroke="#1e293b" rx="4"/>
    <rect x="10" y="10" width="18" height="14" rx="2" class="lora-chip"/>
    <rect x="32" y="10" width="18" height="14" rx="2" fill="#00F5D4"/>
    <rect x="10" y="28" width="40" height="12" rx="2" fill="#38bdf8"/>
  </g>
</svg>
